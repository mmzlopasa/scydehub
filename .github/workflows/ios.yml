name: iOS IPA (unsigned, for Feather)

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx cap sync ios
      - name: Build (no code signing — Feather signs it on the device)
        run: |
          V="${{ github.ref_type == 'tag' && github.ref_name || '0.2.0' }}"; V="${V#v}"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$V" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry scydehub.ipa Payload
          ls -la scydehub.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: scydehub-ipa
          path: ios/app/scydehub.ipa
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/app/scydehub.ipa
