# SCYDE Hub
#   Local (LAN):      docker compose up -d                      → http://<host>:8484
#   Cloudflare Tunnel: TUNNEL_TOKEN in .env, then docker compose --profile tunnel up -d
#   Domain + HTTPS:   ./deploy/init-letsencrypt.sh  (once), then docker compose --profile proxy up -d
name: scydehub

services:
  hub:
    build:
      context: .
      args:
        VERSION: ${SCYDE_VERSION:-0.1.0}
    image: ghcr.io/mmzlopasa/scydehub:${SCYDE_TAG:-latest}
    container_name: scydehub
    restart: unless-stopped
    env_file: .env
    environment:
      SCYDE_SECRET_KEY: ${SCYDE_SECRET_KEY:?Set SCYDE_SECRET_KEY in .env (openssl rand -hex 32)}
    ports:
      - "${HUB_BIND:-0.0.0.0}:${HUB_PORT:-8484}:8484"
    volumes:
      - ./data:/data
      # Optional: Docker integration via a read-only socket proxy is safer than mounting the socket directly
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    sysctls:
      # lets the non-root container send ICMP echo (ping checks) without NET_RAW
      net.ipv4.ping_group_range: "0 2147483647"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Cloudflare Tunnel: no open ports, no nginx/certbot. In the Cloudflare dashboard set the
  # public hostname service to http://hub:8484
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    container_name: scydehub-cloudflared
    restart: unless-stopped
    depends_on: [hub]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

  nginx:
    profiles: [proxy]
    image: nginx:1.27-alpine
    container_name: scydehub-nginx
    restart: unless-stopped
    depends_on: [hub]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      ALLOW_CIDRS: ${ALLOW_CIDRS:-}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/40-allowlist.sh:/docker-entrypoint.d/40-allowlist.sh:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    # reload every 6h so renewed certificates are picked up
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  certbot:
    profiles: [proxy]
    image: certbot/certbot:v3.1.0
    container_name: scydehub-certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
