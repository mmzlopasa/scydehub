<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>SCYDE Hub</title>
  <style>
    :root { color-scheme: dark; --accent: #7c5cff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0a0a10; color: #eceef6; font: 16px -apple-system, system-ui, sans-serif; }
    body { display: grid; place-items: center; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
      background-image: radial-gradient(900px 500px at 0% -10%, rgba(124,92,255,.25), transparent 60%); }
    form { width: 100%; max-width: 420px; background: rgba(22,23,34,.7); border: 1px solid rgba(255,255,255,.08); border-radius: 28px; padding: 28px; backdrop-filter: blur(20px); }
    h1 { margin: 12px 0 4px; font-size: 24px; } p { color: #8b90a6; margin: 0 0 18px; font-size: 14px; line-height: 1.45; }
    label { display: block; font-size: 12px; color: #8b90a6; margin: 14px 0 6px; font-weight: 600; }
    input, select { width: 100%; height: 48px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: inherit; padding: 0 14px; font-size: 16px; }
    button { margin-top: 22px; width: 100%; height: 50px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; }
    .err { color: #ef4444; font-size: 13px; min-height: 18px; margin-top: 10px; }
    .logo { display: flex; gap: 10px; align-items: center; font-weight: 600; }
    .hint { font-size: 12px; color: #8b90a6; margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <form id="f" autocomplete="off">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#16161f"/><rect x="10" y="10" width="20" height="20" rx="5" fill="#7c5cff"/><rect x="34" y="10" width="20" height="12" rx="4" fill="#fff"/><rect x="34" y="26" width="20" height="28" rx="5" fill="#6248e6"/><rect x="10" y="34" width="20" height="20" rx="5" fill="#fff"/></svg>SCYDE Hub</div>
    <h1>Poveži uređaj</h1>
    <p>Upiši adresu Huba i kiosk token (Postavke → Kiosk i uređaji).</p>
    <label for="url">URL Huba</label>
    <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://hub.example.com" required />
    <label for="token">Kiosk token</label>
    <input id="token" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk_…" required />
    <label for="profile">Layout</label>
    <select id="profile"><option value="tablet">Tablet</option><option value="tv">TV / zid (veći font)</option><option value="desktop">Monitor</option><option value="mobile">Mobitel</option></select>
    <button type="submit">Spremi i pokreni</button>
    <div class="err" id="err"></div>
    <div class="hint">Za pravi kiosk uključi <b>Guided Access</b> (Postavke → Pristupačnost → Vođeni pristup) i triput pritisni tipku sa strane. Za povratak na ovaj ekran tapni 5× brzo na sat u gornjem desnom kutu kioska.</div>
  </form>
  <script>
    const K = 'scydehub.shell';
    const saved = JSON.parse(localStorage.getItem(K) || '{}');
    const setup = new URLSearchParams(location.search).has('setup');
    const go = (c) => location.replace(`${c.url}/kiosk?token=${encodeURIComponent(c.token)}&profile=${c.profile}`);
    if (saved.url && saved.token && !setup) go(saved);
    for (const k of ['url', 'token', 'profile']) if (saved[k]) document.getElementById(k).value = saved[k];
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const c = { url: document.getElementById('url').value.trim().replace(/\/+$/, ''), token: document.getElementById('token').value.trim(), profile: document.getElementById('profile').value };
      const err = document.getElementById('err');
      if (!/^https?:\/\//.test(c.url)) { err.textContent = 'URL mora počinjati s http:// ili https://'; return; }
      err.textContent = 'Provjeravam vezu…';
      try {
        const r = await fetch(c.url + '/healthz', { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
      } catch (x) { err.textContent = 'Hub nije dostupan: ' + x.message; return; }
      localStorage.setItem(K, JSON.stringify(c));
      go(c);
    });
  </script>
</body>
</html>
